<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto Mural</title>

    <style>
        *{
            box-sizing: border-box;
        }

        body{
            margin: 0;
            font-family: sans-serif;
            background-color: #f4f4f4;
            color: #222;
        }
        header{
            background: #e30613;
            color: #fff;
            padding: 24px;
            text-align: center;
        }
        main{
            width: min(700px, 92%);
            margin: 28px auto;
        }
        form, article{
            background-origin: #fff;
            padding: 18px;
            margin-bottom: 14px;
            border-radius: 8px;

        }
        input, textarea, button{
            width: 100%;
            padding: 11px;
            margin: 8px 0 14px;
            font: inherit;
        }
        textarea{
            min-height: 90px;
            resize: vertical;
        }
        button{
            background: #e30613;
            color: #fff;
            border: 0;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover{
            background: #b9040e;
        }
        h2{
            margin-top: 28px;
        }
        article{
            border-left: 5px solid #e30613;
        }
        article p{
            margin-bottom: 0;
        }
        #aviso{
            min-height: 22px;
            font-weight: bold;
        }
    </style>
</head>
<body>
<!--Cria 3 divs com id diferente para cada-->
<!-- div*3#seila$ -->

<header>
    <h1>Mural de recados</h1>
    <p>Front + Java + JDBC + MySQL</p>
</header>

<main>
    <form id="form-recado">
        <label for="autor">Nome</label>
        <input type="text" name="autor" required>

        <label for="mensagem">Recado</label>
        <textarea name="mensagem" required></textarea>

        <button type="submit">Publica recado</button>
    </form>

    <p id="aviso"></p>
    <h2>Recados Publicados</h2>

    <section id="lista-recados"></section>
</main>

<script>
    const formulario = document.querySelector('#form-recado');
    const lista = document.querySelector('#lista-recados');
    const aviso = document.querySelector('#aviso');

    async function carregarRecados() {
        const resposta = await fetch("/api/recados");
        const recados = await resposta.json();
        lista.innerHTML = "";

        for (const recado of recados) {
            const cartao = document.createElement("article");
            const autor = document.createElement("strong");
            const mensagem = document.createElement("p");

            autor.textContent = recado.autor;
            mensagem.textContent = recado.mensagem;
            cartao.append(autor, mensagem);
            lista.appendChild(cartao);
        }
    }

    formulario.addEventListener("submit", async function (evento) {
        evento.preventDefault();
        aviso.textContent = "Salvando...";

        const dados = new URLSearchParams(new FormData(formulario));
        const resposta = await fetch("/api/recados", {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: dados
        });

        if (resposta.ok) {
            formulario.reset();
            aviso.textContent = "Recado cadastrado com sucesso!!!";
            await carregarRecados();
        } else {
            aviso.textContent = "Não foi possível cadastrar o recado!!!";
        }
    });

    carregarRecados();
</script>
</body>
</html>
